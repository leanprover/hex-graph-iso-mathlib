name = "hex-graph-iso-mathlib"
defaultTargets = ["HexGraphIsoMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGraphIso"
git = "https://github.com/leanprover/hex-graph-iso.git"
rev = "v0.6.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[require]]
name = "HexPermGroupMathlib"
git = "https://github.com/leanprover/hex-perm-group-mathlib.git"
rev = "v0.6.0"

[[lean_lib]]
name = "HexGraphIsoMathlib"

[[lean_lib]]
name = "HexGraphIsoMathlibTests"
globs = ["HexGraphIsoMathlib.TacticTests", "HexGraphIsoMathlib.SparseTacticTests"]
